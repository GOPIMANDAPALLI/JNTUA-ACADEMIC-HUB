<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Admin Dashboard | JNTUA Academic Hub
    </title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family:
                Arial,
                sans-serif;

            background:
                #f5f7fb;

            color:
                #111827;

        }

        header {

            background:
                #111827;

            color:
                white;

            padding:
                18px 25px;

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                15px;

        }

        header h1 {

            font-size:
                21px;

        }

        .logout {

            border:
                none;

            background:
                #dc2626;

            color:
                white;

            padding:
                10px 18px;

            border-radius:
                7px;

            cursor:
                pointer;

        }

        .container {

            width:
                95%;

            max-width:
                1400px;

            margin:
                30px auto;

        }

        .cards {

            display:
                grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(220px, 1fr)
                );

            gap:
                20px;

            margin-bottom:
                25px;

        }

        .card {

            background:
                white;

            padding:
                25px;

            border-radius:
                12px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.07);

        }

        .card-title {

            color:
                #6b7280;

            font-size:
                14px;

            margin-bottom:
                10px;

        }

        .total {

            font-size:
                32px;

            font-weight:
                bold;

        }

        .toolbar {

            background:
                white;

            padding:
                20px;

            border-radius:
                12px;

            margin-bottom:
                20px;

            display:
                flex;

            gap:
                12px;

            flex-wrap:
                wrap;

        }

        #search {

            flex:
                1;

            min-width:
                250px;

            padding:
                12px;

            border:
                1px solid #d1d5db;

            border-radius:
                8px;

            font-size:
                15px;

        }

        .export {

            border:
                none;

            padding:
                12px 20px;

            border-radius:
                8px;

            background:
                #166534;

            color:
                white;

            cursor:
                pointer;

        }

        .table-box {

            background:
                white;

            border-radius:
                12px;

            overflow-x:
                auto;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.07);

        }

        table {

            width:
                100%;

            min-width:
                1100px;

            border-collapse:
                collapse;

        }

        th,
        td {

            padding:
                13px;

            text-align:
                left;

            border-bottom:
                1px solid #e5e7eb;

        }

        th {

            background:
                #f3f4f6;

            font-size:
                14px;

        }

        td {

            font-size:
                14px;

        }

        .status {

            text-align:
                center;

            padding:
                30px;

            color:
                #6b7280;

        }

        @media(max-width: 600px) {

            header {

                flex-direction:
                    column;

                align-items:
                    flex-start;

            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        JNTUA Academic Hub — Admin
    </h1>

    <button
        class="logout"
        onclick="adminLogout()"
    >
        Logout
    </button>

</header>


<div class="container">


    <div class="cards">

        <div class="card">

            <div class="card-title">
                Total Registered Users
            </div>

            <div
                class="total"
                id="totalUsers"
            >
                0
            </div>

        </div>

    </div>


    <div class="toolbar">

        <input
            type="text"
            id="search"
            placeholder="Search name, email, roll number, branch..."
        >


        <button
            class="export"
            onclick="exportExcel()"
        >
            Export Excel
        </button>

    </div>


    <div class="table-box">

        <table>

            <thead>

                <tr>

                    <th>#</th>

                    <th>Name</th>

                    <th>Email</th>

                    <th>Regulation</th>

                    <th>Roll Number</th>

                    <th>Branch</th>

                    <th>Year</th>

                    <th>College</th>

                    <th>Phone</th>

                    <th>Registered At</th>

                </tr>

            </thead>


            <tbody id="usersTable">

                <tr>

                    <td
                        colspan="10"
                        class="status"
                    >
                        Loading users...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<script>

let allUsers = [];


// ==========================================================
// LOAD USERS
// ==========================================================

async function loadUsers() {

    try {

        const response =
            await fetch(
                '/admin/users'
            );


        // Admin session missing

        if (
            response.status === 401
        ) {

            window.location.href =
                '/owner-panel-x7k9';

            return;

        }


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                'Failed to load users'
            );

        }


        allUsers =
            data.users || [];


        document
            .getElementById(
                'totalUsers'
            )
            .textContent =
            allUsers.length;


        displayUsers(
            allUsers
        );

    }

    catch (error) {

        console.error(error);


        document
            .getElementById(
                'usersTable'
            )
            .innerHTML = `

                <tr>

                    <td
                        colspan="10"
                        class="status"
                    >
                        Failed to load users
                    </td>

                </tr>

            `;

    }

}


// ==========================================================
// DISPLAY USERS
// ==========================================================

function displayUsers(users) {

    const table =
        document.getElementById(
            'usersTable'
        );


    if (!users.length) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="10"
                    class="status"
                >
                    No users found
                </td>

            </tr>

        `;

        return;

    }


    table.innerHTML =
        users
            .map(
                (user, index) => `

                    <tr>

                        <td>
                            ${index + 1}
                        </td>

                        <td>
                            ${escapeHtml(user.name)}
                        </td>

                        <td>
                            ${escapeHtml(user.email)}
                        </td>

                        <td>
                            ${escapeHtml(user.regulation)}
                        </td>

                        <td>
                            ${escapeHtml(user.roll_number)}
                        </td>

                        <td>
                            ${escapeHtml(user.branch)}
                        </td>

                        <td>
                            ${escapeHtml(user.year_of_study)}
                        </td>

                        <td>
                            ${escapeHtml(user.college_name)}
                        </td>

                        <td>
                            ${escapeHtml(user.phone)}
                        </td>

                        <td>
                            ${formatDate(
                                user.registered_at
                            )}
                        </td>

                    </tr>

                `
            )
            .join('');

}


// ==========================================================
// SEARCH
// ==========================================================

document
    .getElementById('search')
    .addEventListener(
        'input',
        function() {

            const query =
                this.value
                    .toLowerCase()
                    .trim();


            const filtered =
                allUsers.filter(
                    user => {

                        return [

                            user.name,

                            user.email,

                            user.roll_number,

                            user.branch,

                            user.college_name,

                            user.phone

                        ]
                            .join(' ')
                            .toLowerCase()
                            .includes(query);

                    }
                );


            displayUsers(
                filtered
            );

        }
    );


// ==========================================================
// HTML SECURITY
// ==========================================================

function escapeHtml(value) {

    return String(
        value ?? ''
    )
        .replace(
            /&/g,
            '&amp;'
        )
        .replace(
            /</g,
            '&lt;'
        )
        .replace(
            />/g,
            '&gt;'
        )
        .replace(
            /"/g,
            '&quot;'
        )
        .replace(
            /'/g,
            '&#039;'
        );

}


// ==========================================================
// DATE
// ==========================================================

function formatDate(date) {

    if (!date) {
        return '';
    }


    const d =
        new Date(date);


    if (
        isNaN(
            d.getTime()
        )
    ) {

        return date;

    }


    return d.toLocaleString();

}


// ==========================================================
// EXPORT EXCEL
// ==========================================================

function exportExcel() {

    window.location.href =
        '/admin/export-users';

}


// ==========================================================
// ADMIN LOGOUT
// ==========================================================

async function adminLogout() {

    try {

        await fetch(
            '/admin/logout',
            {
                method: 'POST'
            }
        );

    }

    catch (error) {

        console.error(error);

    }


    window.location.href =
        '/owner-panel-x7k9';

}


// ==========================================================
// START
// ==========================================================

loadUsers();

</script>

</body>

</html>
